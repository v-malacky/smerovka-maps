name: Zostavenie máp

on:
  schedule:
    - cron: "0 2 3 * *"   # 3. deň v mesiaci o 02:00 UTC (Geofabrik/Protomaps sú už aktuálne)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-maps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Uvoľniť miesto na disku
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nástroje
        run: pip install pyvalhalla osmium pmtiles requests

      - name: Zostaviť balíky
        run: bash tools/ci_build.sh

      - name: Zverejniť release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python tools/publish_github.py "${{ github.repository }}"
